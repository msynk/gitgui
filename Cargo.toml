[package]
name = "gitgui"
version = "0.1.0"
edition = "2021"
description = "Ultra-light native Windows Git client modeled on the VS Code Source Control experience"
license = "MIT"

[features]
guard-alloc = []

[dependencies.windows-sys]
version = "0.59.0"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_Time",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Registry",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
opt-level = 1
